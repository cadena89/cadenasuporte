# Compila o Cliente e o Tecnico do Windows a partir deste repositorio e assina os executaveis com o
# certificado da marca (scripts\gerar_certificado.ps1), quando os segredos estiverem definidos.
#
# Configuracao em Settings > Secrets and variables > Actions:
#   Variaveis (aba Variables):
#     CADENA_SERVIDOR1, CADENA_CHAVE1, CADENA_NOME1   servidor principal (hbbs), chave publica e nome na tela
#     CADENA_SERVIDOR2, CADENA_CHAVE2, CADENA_NOME2   segundo servidor (opcional)
#     CADENA_API                                      endereco HTTPS da API
#     CADENA_REPO_ATUALIZACAO, CADENA_CHAVE_ATUALIZACAO  releases e chave PUBLICA Ed25519 da atualizacao
#     CADENA_CERTIFICADO                              certificado PUBLICO (.cer em base64): o instalador o grava
#                                                     como confiavel
#   Segredos (aba Secrets), opcionais; sem eles os executaveis saem sem assinatura:
#     CADENA_CERTIFICADO_PFX                          o .pfx (chave privada) em base64
#     CADENA_CERTIFICADO_SENHA                        a senha do .pfx
# A chave PRIVADA da atualizacao nunca vai para o GitHub: o versao.assinado e feito na maquina que publica
# (scripts\9_publicar.ps1 -SemCompilar), com os executaveis ja assinados.
name: Windows

on:
  # So manual: a tag vX.Y.Z e criada depois, junto com a release (gh release create), com os executaveis deste build
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versao publica (SemVer, ex.: 1.0.0): nome dos arquivos e da tag'
        required: true
        default: '1.0.0'
      numero:
        description: 'Numero interno da versao (atualizacao automatica: precisa ser maior que o instalado)'
        required: true
        default: '1'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CADENA_RAIZ: C:\cb
      CADENA_ENTREGA: C:\cb\entrega
      CADENA_MARCA: cadenatech
      CADENA_SERVIDOR1: ${{ vars.CADENA_SERVIDOR1 }}
      CADENA_CHAVE1: ${{ vars.CADENA_CHAVE1 }}
      CADENA_NOME1: ${{ vars.CADENA_NOME1 }}
      CADENA_SERVIDOR2: ${{ vars.CADENA_SERVIDOR2 }}
      CADENA_CHAVE2: ${{ vars.CADENA_CHAVE2 }}
      CADENA_NOME2: ${{ vars.CADENA_NOME2 }}
      CADENA_API: ${{ vars.CADENA_API }}
      CADENA_REPO_ATUALIZACAO: ${{ vars.CADENA_REPO_ATUALIZACAO }}
      CADENA_CHAVE_ATUALIZACAO: ${{ vars.CADENA_CHAVE_ATUALIZACAO }}
      CADENA_CERTIFICADO: ${{ vars.CADENA_CERTIFICADO }}
      CADENA_NUMERO: ${{ inputs.numero }}
      CADENA_VERSAO: ${{ inputs.versao }}
      VCPKG_DEFAULT_BINARY_CACHE: C:\cb\vcpkg-cache
    steps:
      - uses: actions/checkout@v5

      - name: Conferir a configuracao
        shell: powershell
        run: |
          $faltam = 'CADENA_SERVIDOR1', 'CADENA_CHAVE1', 'CADENA_REPO_ATUALIZACAO', 'CADENA_CHAVE_ATUALIZACAO' | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($faltam) { throw "Defina em Settings > Secrets and variables > Actions > Variables: $($faltam -join ', ')" }
          if ($env:CADENA_VERSAO -notmatch '^\d+\.\d+\.\d+$') { throw "versao precisa seguir o SemVer, ex.: 1.0.0" }
          if ($env:CADENA_NUMERO -notmatch '^\d+$') { throw "numero precisa ser um numero inteiro" }
          git config --system core.longpaths true
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      # Rust, cargo-expand/flutter_rust_bridge_codegen e os pacotes ja compilados do vcpkg
      - name: Cache das ferramentas
        uses: actions/cache@v5
        with:
          path: |
            C:\cb\ferramentas\rustup
            C:\cb\ferramentas\cargo
            C:\cb\vcpkg-cache
          key: windows-ferramentas-v1-${{ hashFiles('scripts/1_ferramentas.ps1', 'scripts/3_dependencias.ps1') }}

      - name: Ferramentas e codigo do RustDesk
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\1_ferramentas.ps1

      - name: Bibliotecas (vcpkg) e geradores
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\3_dependencias.ps1

      - name: Marca, servidores e modificacoes
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\2_marca.ps1

      # Os segredos do certificado so existem neste passo (o 6_empacotar assina o programa e o instalador)
      - name: Compilar e assinar Tecnico e Cliente
        shell: powershell
        env:
          CADENA_CERTIFICADO_PFX: ${{ secrets.CADENA_CERTIFICADO_PFX }}
          CADENA_CERTIFICADO_SENHA: ${{ secrets.CADENA_CERTIFICADO_SENHA }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\8_compilar_perfis.ps1

      - name: Enviar os executaveis
        uses: actions/upload-artifact@v6
        with:
          name: windows
          # Os instaladores (suporte-vX.Y.Z-client-x64.exe e -tech-x64.exe); o portatil e o mesmo exe com outro nome
          path: C:/cb/entrega/suporte-v*-x64.exe
          if-no-files-found: error

      - name: Fonte correspondente (AGPL)
        uses: actions/upload-artifact@v6
        with:
          name: fonte
          path: C:/cb/entrega/fonte/
          if-no-files-found: error
