# Compila o Cliente do macOS (Apple Silicon e Intel) com a marca, sem assinatura da Apple (so a assinatura local,
# "ad-hoc", que o Mac com chip M exige para abrir). Tres etapas:
#   1. marca (Windows): o 2_marca.ps1 precisa do Windows (Edge e System.Drawing para as imagens). Aplica a marca no
#      codigo do RustDesk e entrega a diferenca (patch) como artefato.
#   2. ponte (Linux): gera a ponte Flutter/Rust a partir do codigo ja com a marca (o 2_marca mexe no flutter_ffi.rs).
#   3. macos: aplica o patch, poe o nome e o icone da marca no app (SuporteVetorSistemas.app: o RustDesk do Mac
#      procura /Applications/<nome do app>.app) e compila como o CI oficial do RustDesk. Sai um .dmg por arquitetura.
#
# Configuracao no ambiente (Settings > Environments) com o nome da marca (ex.: vetor):
#   Variaveis: CADENA_SERVIDOR1, CADENA_CHAVE1, CADENA_NOME1, CADENA_SERVIDOR2, CADENA_CHAVE2, CADENA_NOME2,
#              CADENA_API, CADENA_REPO_ATUALIZACAO, CADENA_CHAVE_ATUALIZACAO, CADENA_CERTIFICADO (iguais ao windows.yml)
#   Segredo:   CADENA_MARCA_ZIP  a pasta da marca (marca.psd1 + SVGs) num .zip em base64
name: macOS

on:
  workflow_dispatch:
    inputs:
      marca:
        description: 'Ambiente com a configuracao da marca'
        required: true
        default: 'vetor'
      versao:
        description: 'Versao publica (SemVer, ex.: 1.0.0)'
        required: true
        default: '1.0.0'
      numero:
        description: 'Numero interno da versao'
        required: true
        default: '14'
  push:
    branches: [mac]
    paths:
      - '.github/workflows/macos.yml'
      - 'scripts/2_marca.ps1'
      - 'scripts/configuracao.ps1'
      - 'scripts/modelos/**'

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG_RUSTDESK: '1.5.3'
  CADENA_VERSAO: ${{ inputs.versao || '1.0.0' }}
  CADENA_NUMERO: ${{ inputs.numero || '14' }}
  # Mesmas versoes do CI oficial do RustDesk 1.5.3 (flutter-build.yml e bridge.yml)
  MAC_RUST_VERSION: '1.81'
  BRIDGE_RUST_VERSION: '1.75'
  CARGO_EXPAND_VERSION: '1.0.95'
  FLUTTER_RUST_BRIDGE_VERSION: '1.80.1'
  FLUTTER_VERSION: '3.24.5'
  FLUTTER_MACOS_ARM_VERSION: '3.44.9'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
  marca:
    runs-on: windows-2022
    environment: ${{ inputs.marca || 'vetor' }}
    timeout-minutes: 60
    env:
      CADENA_RAIZ: C:\cb
      CADENA_ENTREGA: C:\cb\entrega
      CADENA_MARCA: C:\cb\marca
      CADENA_SERVIDOR1: ${{ vars.CADENA_SERVIDOR1 }}
      CADENA_CHAVE1: ${{ vars.CADENA_CHAVE1 }}
      CADENA_NOME1: ${{ vars.CADENA_NOME1 }}
      CADENA_SERVIDOR2: ${{ vars.CADENA_SERVIDOR2 }}
      CADENA_CHAVE2: ${{ vars.CADENA_CHAVE2 }}
      CADENA_NOME2: ${{ vars.CADENA_NOME2 }}
      CADENA_API: ${{ vars.CADENA_API }}
      CADENA_REPO_ATUALIZACAO: ${{ vars.CADENA_REPO_ATUALIZACAO }}
      CADENA_CHAVE_ATUALIZACAO: ${{ vars.CADENA_CHAVE_ATUALIZACAO }}
      CADENA_CERTIFICADO: ${{ vars.CADENA_CERTIFICADO }}
    steps:
      - uses: actions/checkout@v5

      - name: Pasta da marca (segredo)
        shell: powershell
        env:
          CADENA_MARCA_ZIP: ${{ secrets.CADENA_MARCA_ZIP }}
        run: |
          if (-not $env:CADENA_MARCA_ZIP) { throw 'Defina o segredo CADENA_MARCA_ZIP no ambiente da marca' }
          New-Item -ItemType Directory -Force C:\cb | Out-Null
          [IO.File]::WriteAllBytes('C:\cb\marca.zip', [Convert]::FromBase64String($env:CADENA_MARCA_ZIP))
          Expand-Archive -Force C:\cb\marca.zip $env:CADENA_MARCA
          Remove-Item C:\cb\marca.zip
          if (-not (Test-Path "$env:CADENA_MARCA\marca.psd1")) { throw 'O zip da marca precisa ter o marca.psd1 na raiz' }

      - name: Codigo do RustDesk
        shell: powershell
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch $env:TAG_RUSTDESK --recurse-submodules --shallow-submodules https://github.com/rustdesk/rustdesk.git C:\cb\rustdesk
          if ($LASTEXITCODE -ne 0) { throw 'clone do RustDesk' }

      - name: Marca, servidores e modificacoes
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\2_marca.ps1

      # O patch sai em LF (o git converte ao comparar) e com os binarios (imagens da marca)
      - name: Patch da marca e dados para o macOS
        shell: powershell
        run: |
          $out = 'C:\cb\saida'
          New-Item -ItemType Directory -Force $out | Out-Null
          # cmd para gravar os bytes do git como sao (o pipe do PowerShell recodifica o texto)
          git -C C:\cb\rustdesk\libs\hbb_common add -A
          cmd /c "git -C C:\cb\rustdesk\libs\hbb_common diff --cached --binary HEAD > $out\hbb_common.patch"
          git -C C:\cb\rustdesk add -A -- . ':!libs/hbb_common'
          cmd /c "git -C C:\cb\rustdesk diff --cached --binary HEAD -- . :!libs/hbb_common > $out\rustdesk.patch"
          if ((Get-Item "$out\hbb_common.patch").Length -lt 100) { throw 'patch do hbb_common vazio' }
          if ((Get-Item "$out\rustdesk.patch").Length -lt 1000) { throw 'patch da marca vazio' }
          Copy-Item C:\cb\marca-gerada\icone-1024.png $out\
          . .\scripts\configuracao.ps1
          $info = @(
            "CADENA_APP=$($Marca.NomeCliente)",
            "CADENA_EXIBIDO=$($Marca.ExibidoCliente)",
            "CADENA_BUNDLE=$($Marca.Organizacao).$($Marca.NomeCliente.ToLower())",
            "CADENA_EMPRESA=$($Marca.Empresa)"
          )
          [IO.File]::WriteAllLines("$out\marca.env", $info, (New-Object Text.UTF8Encoding $false))
          Get-ChildItem $out | Select-Object Name, Length

      - uses: actions/upload-artifact@v6
        with:
          name: marca
          path: C:\cb\saida\
          retention-days: 3
          if-no-files-found: error

  ponte:
    needs: marca
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        job:
          - { flutter: '3.22.3', nome: ponte-flutter-3.24 }
          - { flutter: '3.44.8', nome: ponte-flutter-3.44 }
    steps:
      - uses: actions/checkout@v5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.TAG_RUSTDESK }}
          submodules: recursive

      - uses: actions/download-artifact@v5
        with:
          name: marca
          path: /tmp/marca

      - name: Aplicar a marca
        run: |
          git -C libs/hbb_common apply --binary --whitespace=nowarn /tmp/marca/hbb_common.patch
          git apply --binary --whitespace=nowarn /tmp/marca/rustdesk.patch

      - name: Pacotes
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.BRIDGE_RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ponte

      - name: Cache do gerador
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ponte-gerador-${{ env.FLUTTER_RUST_BRIDGE_VERSION }}-${{ env.CARGO_EXPAND_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.job.flutter }}
          cache: true

      - name: Gerar a ponte
        run: |
          command -v cargo-expand || cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          command -v flutter_rust_bridge_codegen || cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          if [[ "${{ matrix.job.flutter }}" == "3.22.3" ]]; then
            sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          else
            bash .github/patches/apply_flutter_3.44_source_patches.sh
          fi
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.job.nome }}
          retention-days: 3
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  macos:
    needs: ponte
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: aarch64-apple-darwin, os: macos-15, arch: arm64, triplet: arm64-osx, ponte: ponte-flutter-3.44, build-args: '--screencapturekit' }
          - { target: x86_64-apple-darwin, os: macos-15-intel, arch: x64, triplet: x64-osx, ponte: ponte-flutter-3.24, build-args: '' }
    steps:
      - name: Cache do GitHub para o vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@v5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.TAG_RUSTDESK }}
          submodules: recursive

      - uses: actions/download-artifact@v5
        with:
          name: marca
          path: /tmp/marca

      - name: Aplicar a marca
        run: |
          git -C libs/hbb_common apply --binary --whitespace=nowarn /tmp/marca/hbb_common.patch
          git apply --binary --whitespace=nowarn /tmp/marca/rustdesk.patch
          cat /tmp/marca/marca.env >> "$GITHUB_ENV"

      - name: Nome, identificador e icone do app
        run: |
          # CADENA_APP, CADENA_BUNDLE, CADENA_EMPRESA e CADENA_EXIBIDO vem do marca.env (GITHUB_ENV, passo anterior)
          # O RustDesk do Mac procura /Applications/<nome>.app/Contents/MacOS/<nome>: o nome do produto e o nome interno
          sed -i '' -e "s/^PRODUCT_NAME = .*/PRODUCT_NAME = ${CADENA_APP}/" \
            -e "s/^PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = ${CADENA_BUNDLE}/" \
            -e "s/^PRODUCT_COPYRIGHT = .*/PRODUCT_COPYRIGHT = ${CADENA_EMPRESA}. Baseado no RustDesk (AGPL-3.0)./" \
            flutter/macos/Runner/Configs/AppInfo.xcconfig
          cat flutter/macos/Runner/Configs/AppInfo.xcconfig
          # Perfil do Cliente no Flutter e o servico copiado para dentro do app com o nome novo
          sed -i '' -e "s#flutter build macos --release')#flutter build macos --release --dart-define=APP_TYPE=client')#" \
            -e "s#/Release/RustDesk.app/Contents/MacOS/#/Release/${CADENA_APP}.app/Contents/MacOS/#" build.py
          grep -q "APP_TYPE=client" build.py
          grep -q "/Release/${CADENA_APP}.app/Contents/MacOS/" build.py
          grep -q "PRODUCT_NAME = ${CADENA_APP}" flutter/macos/Runner/Configs/AppInfo.xcconfig
          # Icone do app (.icns) a partir do icone da marca
          mkdir -p /tmp/AppIcon.iconset
          for t in 16 32 128 256 512; do
            sips -z $t $t /tmp/marca/icone-1024.png --out /tmp/AppIcon.iconset/icon_${t}x${t}.png >/dev/null
            sips -z $((t*2)) $((t*2)) /tmp/marca/icone-1024.png --out /tmp/AppIcon.iconset/icon_${t}x${t}@2x.png >/dev/null
          done
          iconutil -c icns /tmp/AppIcon.iconset -o flutter/macos/Runner/AppIcon.icns

      - name: Ferramentas
        run: |
          brew install llvm create-dmg
          command -v pkg-config >/dev/null || brew install pkg-config
          wget -q https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          rm -rf nasm-2.16.03 nasm-2.16.03-macosx.zip
          nasm --version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.job.arch == 'arm64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Ajustes do Flutter (iguais ao CI do RustDesk)
        run: |
          if [[ "${{ matrix.job.arch }}" == "arm64" ]]; then
            flutter config --no-enable-swift-package-manager
            brew install gnu-sed
            export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
            bash .github/patches/apply_flutter_3.44_source_patches.sh
          else
            pushd "$(dirname "$(dirname "$(which flutter)")")"
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
            popd
          fi
          # perl: no arm64 o sed da vez e o GNU (o -i '' do macOS nao vale nele)
          cd "$(dirname "$(which flutter)")"
          perl -pi -e 's#_setFramesEnabledState\(false\);#//_setFramesEnabledState(false);#g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.job.ponte }}
          path: ./

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Bibliotecas (vcpkg)
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; done
            exit 1
          fi

      - name: Compilar
        run: |
          if [ "${{ matrix.job.arch }}" = "arm64" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i '' -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i '' -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i '' -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i '' -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            export MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.build-args }}

      # Sem conta de desenvolvedor da Apple: assinatura local (ad-hoc), obrigatoria para o arm64 abrir. O Mac avisa
      # que o desenvolvedor nao e identificado; o usuario libera em Ajustes > Privacidade e Seguranca > Abrir mesmo assim
      - name: Assinatura local e .dmg
        run: |
          APP="flutter/build/macos/Build/Products/Release/${CADENA_APP}.app"
          test -x "$APP/Contents/MacOS/${CADENA_APP}"
          test -x "$APP/Contents/MacOS/service"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          DMG="suporte-v${CADENA_VERSAO}-client-macos-${{ matrix.job.arch }}.dmg"
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i '' -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG" || true
          create-dmg --volname "${CADENA_EXIBIDO}" --icon "${CADENA_APP}.app" 200 190 --hide-extension "${CADENA_APP}.app" \
            --window-size 800 400 --app-drop-link 600 185 "$DMG" "$APP"
          ls -la "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.job.arch }}
          path: ${{ env.DMG }}
          if-no-files-found: error
